services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: football_edge
      POSTGRES_USER: football_edge
      POSTGRES_PASSWORD: football_edge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://football_edge:football_edge@db:5432/football_edge
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  pgdata:
